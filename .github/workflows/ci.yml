name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS は対象外（docs/adr/0005-drop-macos.md）
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      # CI の実行環境は開発 PC より大幅に遅いため、性能の目安（AC1-1 / AC1-2）を 5 倍に緩める。
      # 受け入れ基準の判定は開発 PC で行い、CI では大きな劣化だけを検出する（docs/test-strategy.md）
      PERF_BUDGET_SCALE: "5"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # lint・型チェック・フォーマット・単体テスト・フロントエンドビルド
      - run: npm run check:web

      # Rust: plantuml.jar 取得・fmt・clippy・単体テスト（dist/ が必要なので check:web の後）
      - run: npm run check:rust

      # 実際の Java と plantuml.jar を使う結合テスト
      - run: npm run test:integration

      # アプリ本体のビルド（E2E で使う。インストーラー作成はフェーズ C）
      - run: npm run build:debug

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: |
          npm run fetch:msedgedriver
          npm run test:e2e:only

      - name: E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e:only
