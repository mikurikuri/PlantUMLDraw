[package]
name = "plantumldraw"
version = "0.1.0"
description = "A desktop editor for PlantUML diagrams"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Windows で bin と lib の名前が衝突しないよう _lib を付ける
name = "plantumldraw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 実際の Java と plantuml.jar を使う結合テスト（tests/render_integration.rs）
integration = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
